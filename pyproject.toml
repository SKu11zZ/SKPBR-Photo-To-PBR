[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skpbr"
version = "0.4.0"
description = "A research-preview model for aligned image-plus-text PBR reconstruction and experimental text-only material generation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SKu11zZ" }]
keywords = ["pbr", "material-reconstruction", "basecolor", "blender", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "torch>=2.2",
]

[project.urls]
Homepage = "https://github.com/SKu11zZ/SKPBR-Photo-To-PBR"
Repository = "https://github.com/SKu11zZ/SKPBR-Photo-To-PBR.git"
Issues = "https://github.com/SKu11zZ/SKPBR-Photo-To-PBR/issues"

[project.scripts]
skpbr = "skpbr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skpbr = ["weights/*.pt"]
